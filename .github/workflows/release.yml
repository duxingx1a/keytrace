name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build release
        run: cargo build --release

      - name: Pack to zip
        run: Compress-Archive -Path target/release/keytrace.exe -DestinationPath keytrace-v0.1.0.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: keytrace-v0.1.0.zip
          body: |
            解压后双击 `keytrace.exe` 运行，系统托盘常驻，右键打开 Dashboard。

            数据库路径 `%LOCALAPPDATA%/KeyTrace/keytrace.db`，换位置不影响历史数据。

            > 如 Windows Defender 拦截，点击「更多信息」→「仍要运行」
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
