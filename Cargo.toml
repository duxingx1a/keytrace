[package]
name = "keytrace"
version = "0.1.0"
edition = "2021"
description = "轻量级 Windows 键盘/鼠标统计工具"

[dependencies]
# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
] }

# HTTP 服务器
tiny_http = "0.12"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 嵌入前端静态文件到 exe
rust-embed = "8"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
